<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Install SetupVPN</title>
  <style>
    body {
      font: 15px/1.5 system-ui, sans-serif;
      max-width: 560px;
      margin: 48px auto;
      padding: 0 20px;
      color: #111;
    }
    h1 { font-size: 22px; margin: 0 0 12px; }
    .note {
      background: #f4f4f4;
      border-radius: 8px;
      padding: 12px 14px;
      margin: 16px 0;
    }
    button, a.btn {
      display: inline-block;
      margin: 8px 8px 0 0;
      padding: 8px 14px;
      border: 0;
      border-radius: 8px;
      background: #1a7f37;
      color: #fff;
      font: inherit;
      text-decoration: none;
      cursor: pointer;
    }
    button.secondary { background: #555; }
  </style>
</head>
<body>
  <h1>Install SetupVPN first</h1>
  <p>This reconnector only clicks countries on the SetupVPN dashboard. It needs the official SetupVPN extension installed and enabled.</p>
  <div class="note">
    After installing SetupVPN, reload this helper, open the dashboard, connect once, and it will remember that location.
  </div>
  <a class="btn" id="store" href="https://chromewebstore.google.com/detail/setupvpn-lifetime-free-vpn/oofgbpoabipfcfjapgnbbjjaenockbdp">Install SetupVPN</a>
  <button class="secondary" id="recheck">I installed it — recheck</button>
  <p id="status"></p>
  <script src="install-setupvpn.js"></script>
</body>
</html>
