<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>SetupVPN dashboard</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #0f1115;
      color: #e8eaed;
      font: 12px/1.4 system-ui, sans-serif;
    }
    #bar {
      display: flex;
      gap: 8px;
      align-items: center;
      padding: 8px 10px;
      border-bottom: 1px solid #2a2f3a;
      background: #161a22;
    }
    #bar button {
      border: 0;
      border-radius: 6px;
      padding: 6px 10px;
      background: #3b82f6;
      color: #fff;
      cursor: pointer;
      font-weight: 600;
    }
    #bar button.secondary { background: #2a2f3a; }
    #status { flex: 1; opacity: 0.85; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #frame {
      border: 0;
      width: 100%;
      height: calc(100% - 42px);
      background: #fff;
    }
    #empty {
      padding: 16px;
      display: none;
    }
    #empty.show { display: block; }
  </style>
</head>
<body>
  <div id="bar">
    <button id="reload" type="button">Reload</button>
    <button id="focusTab" class="secondary" type="button">Open tab</button>
    <span id="status">Loading…</span>
  </div>
  <div id="empty">No SetupVPN host yet. Open SetupVPN (toolbar icon) once, then hit Reload.</div>
  <iframe id="frame" title="SetupVPN dashboard" allow="clipboard-read; clipboard-write"></iframe>
  <script src="sidepanel.js"></script>
</body>
</html>
